name: Publish Bare-Metal Binaries (S3)

# Builds the mosaic bare-metal binaries — mosaic and mosaic-peer-id — from a
# chosen ref and publishes them, with SHA-256 checksums, to the central
# shared-services artifact bucket so external bare-metal operators can DOWNLOAD
# prebuilt binaries instead of building from source. STR-3985.
#
# SECURITY MODEL
# --------------
# The ref to build is a free-form dispatch input (any commit/branch/tag/release),
# so its build scripts (build.rs, proc-macros) are UNTRUSTED code. Two jobs keep
# that code away from the AWS credentials:
#   * build   — checks out + compiles the untrusted ref. Has NO id-token, so a
#               malicious ref cannot mint/exfiltrate an OIDC token. Emits the
#               binaries as a workflow artifact.
#   * publish — downloads that artifact and uploads to S3. Has id-token:write but
#               checks out no untrusted code and runs only trusted steps.
#
# Publish is gated on the `baremetal-binaries` GitHub Environment: GitHub sets
# the OIDC `sub` to `repo:alpenlabs/mosaic:environment:baremetal-binaries`, which
# is what github-actions-mosaic-binary-s3 trusts. The environment's deployment-
# branch policy is pinned to `main` (so the run definition is always the reviewed
# main copy) and carries required-reviewer protection.
#
# Objects land at:
#   s3://alpen-mosaic-artifacts/binaries/mosaic/<built-commit>/linux-amd64/
#     mosaic  mosaic-peer-id  (+ a .sha256 sidecar each)
# A commit's prefix is write-once: publish refuses to overwrite an existing one.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to build & publish — commit SHA, branch, tag, or release (default: main)"
        required: false
        default: "main"
        type: string

# One publish per ref at a time; never cancel an in-flight publish mid-upload.
concurrency:
  group: publish-baremetal-binaries-${{ inputs.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_TO_ASSUME: arn:aws:iam::496607027995:role/github-actions-mosaic-binary-s3
  S3_BUCKET: alpen-mosaic-artifacts
  S3_PREFIX_ROOT: binaries/mosaic
  PLATFORM: linux-amd64
  RUST_NIGHTLY: nightly-2026-07-10 # pinned for reproducible published binaries

jobs:
  build:
    name: Build binaries (untrusted ref, no credentials)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read # deliberately no id-token here
    outputs:
      commit: ${{ steps.rev.outputs.sha }}
    steps:
      - name: Checkout the ref to build
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Resolve built commit (immutable SHA)
        id: rev
        run: |
          set -euo pipefail
          sha="$(git rev-parse HEAD)"
          if [ -z "${sha}" ]; then
            echo "::error::failed to resolve commit SHA"; exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Built commit: ${sha}"

      - name: Install FoundationDB client 7.3.69 (verified, required to link)
        # Inlined in the REVIEWED workflow (not ./.github/actions from the built
        # ref), so the pinned version + checksum can't be silently bypassed by an
        # old/modified ref. 7.3.69 matches mosaic's own CI build; libfdb_c is
        # dynamically linked so operators still run their own cluster.
        run: |
          set -euo pipefail
          deb="foundationdb-clients_7.3.69-1_amd64.deb"
          curl -fsSLO --proto "=https" --tlsv1.2 \
            "https://github.com/apple/foundationdb/releases/download/7.3.69/${deb}"
          echo "ea59d1708519798c7bc4f514cd29af1ac8e41dccbec4371f22d86b713ea81cbf  ${deb}" | sha256sum -c -
          sudo dpkg -i "${deb}"
          rm -f "${deb}"

      - name: Install Rust toolchain (pinned nightly)
        run: |
          set -euo pipefail
          rustup toolchain install "${RUST_NIGHTLY}" --profile minimal
          rustup default "${RUST_NIGHTLY}"

      - name: Rust cache
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2
        with:
          cache-on-failure: true

      - name: Build release binaries
        run: cargo build --release --locked --bin mosaic --bin mosaic-peer-id

      - name: Stage binaries + checksums
        run: |
          set -euo pipefail
          mkdir -p out
          for b in mosaic mosaic-peer-id; do
            install -m 0755 "target/release/${b}" "out/${b}"
            ( cd out && sha256sum "${b}" > "${b}.sha256" )
          done
          echo "Staged:"; ls -la out

      - name: Upload built binaries as workflow artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mosaic-binaries-${{ steps.rev.outputs.sha }}
          path: out/
          if-no-files-found: error
          retention-days: 7 # must outlast the publish job's reviewer-approval wait

  publish:
    name: Publish to S3 (credentialed, no untrusted code)
    needs: build
    # Only the reviewed main copy of this workflow may publish. workflow_dispatch
    # can run a feature branch's YAML, so gate the OIDC-enabled job on the run ref
    # (belt-and-suspenders with the environment's main-only deployment policy).
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: baremetal-binaries
    # Serialize by resolved commit so two refs at the same commit can't double-publish.
    concurrency:
      group: publish-baremetal-s3-${{ needs.build.outputs.commit }}
      cancel-in-progress: false
    permissions:
      id-token: write # assume the S3 upload role via OIDC
      contents: read
    env:
      COMMIT: ${{ needs.build.outputs.commit }}
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mosaic-binaries-${{ needs.build.outputs.commit }}
          path: out

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ env.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3 (write-once per commit)
        run: |
          set -euo pipefail
          DEST="s3://${S3_BUCKET}/${S3_PREFIX_ROOT}/${COMMIT}/${PLATFORM}"
          # Fail closed: capture the list result OUTSIDE an `if` so a list error
          # (missing ListBucket, transient) fails the job via set -e instead of
          # being treated as "not published" and overwriting a trusted prefix.
          key="$(aws s3api list-objects-v2 --bucket "${S3_BUCKET}" \
                  --prefix "${S3_PREFIX_ROOT}/${COMMIT}/" --max-items 1 \
                  --query 'Contents[0].Key' --output text)"
          if [ "${key}" != "None" ] && [ -n "${key}" ]; then
            echo "::error::${S3_PREFIX_ROOT}/${COMMIT}/ already published — refusing to overwrite"
            exit 1
          fi
          aws s3 cp out/ "${DEST}/" --recursive --no-progress
          echo "Published to ${DEST}/"

      - name: Job summary
        env:
          BUILT_REF: ${{ inputs.ref }}
        run: |
          {
            echo "### Bare-metal binaries published"
            echo ""
            echo "- ref built: \`${BUILT_REF}\` → commit \`${COMMIT}\`"
            echo "- location: \`s3://${S3_BUCKET}/${S3_PREFIX_ROOT}/${COMMIT}/${PLATFORM}/\`"
            echo "- binaries: \`mosaic\`, \`mosaic-peer-id\` (+ \`.sha256\` each)"
          } >> "$GITHUB_STEP_SUMMARY"
